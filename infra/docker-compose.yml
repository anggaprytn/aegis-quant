services:
  postgres:
    image: postgres:16
    container_name: aegis-quant-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegis_quant}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis_quant}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: aegis-quant-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      API_BIND_ADDR: 0.0.0.0:3000
    ports:
      - "3000:3000"

  dashboard:
    image: node:20-alpine
    container_name: aegis-quant-dashboard
    profiles: ["dashboard"]
    restart: unless-stopped
    working_dir: /app/apps/dashboard
    depends_on:
      api:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000}
    command:
      [
        "sh",
        "-c",
        "npm install && npm run dev -- --hostname 0.0.0.0 --port 3001",
      ]
    volumes:
      - ..:/app
    ports:
      - "3001:3001"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: aegis-quant-prometheus
    profiles: ["prometheus"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

volumes:
  postgres_data:
