services:
  postgres:
    image: postgres:16
    container_name: aegis-quant-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegis_quant}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis_quant}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: postgres:16
    container_name: aegis-quant-migrate
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ..:/app:ro
    working_dir: /app
    command:
      [
        "sh",
        "-ec",
        "find crates/db/migrations -maxdepth 1 -type f -name '*.sql' | sort | while IFS= read -r f; do echo \"==> applying $$f\"; psql -h postgres -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis_quant} -v ON_ERROR_STOP=1 -f \"$$f\"; done",
      ]

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: aegis-quant-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      API_BIND_ADDR: 0.0.0.0:3000
    ports:
      - "127.0.0.1:3100:3000"

  market-ingest:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: aegis-quant-market-ingest
    profiles: ["ingest"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://aegis:${POSTGRES_PASSWORD}@postgres:5432/aegis_quant
    command: ["market-ingest"]

  testnet-shadow-runner:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: aegis-quant-shadow-runner
    profiles: ["shadow"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://aegis:${POSTGRES_PASSWORD}@postgres:5432/aegis_quant
    command: ["testnet-shadow-runner"]

  dashboard:
    build:
      context: ../apps/dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    container_name: aegis-quant-dashboard
    profiles: ["dashboard"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:3101:3001"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: aegis-quant-prometheus
    profiles: ["prometheus"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

volumes:
  postgres_data:
